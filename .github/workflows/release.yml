name: release

# Builds a signed release APK and attaches it to a GitHub release.
#
# Signing material never enters the repository. The keystore travels as a
# base64 blob in ANDROID_KEYSTORE_B64 and is materialised into
# android/key.properties + android/app/<keystore> only for the duration of
# the build. Losing either secret means losing the signing identity for
# good — Android offers no way to re-sign an already-published app.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build when not triggered by a tag (e.g. 1.3.0). Blank uses pubspec.yaml.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      # Match the keystore to the version being built so a rerun produces
      # the same signature rather than silently reusing the last one.
      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # pubspec carries "1.3.0+15"; the build number has to come along
          # or Android will refuse to install over an equal versionCode.
          from_pubspec="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          name="${from_pubspec%%+*}"
          code="${from_pubspec##*+}"
          if [ "$name" != "$version" ]; then
            echo "::warning::pubspec.yaml says $name but this build was asked for $version; using the tag."
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Materialise release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::signing secrets are not configured; refusing to fall back to a debug-signed release"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          # printf rather than a heredoc: a heredoc terminator has to sit
          # at column 0, which terminates the YAML block scalar early.
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASSWORD" "$STORE_PASSWORD" "$KEY_ALIAS" upload-keystore.jks \
            > android/key.properties
          # A bare keytool failure here would be the only clue about a bad
          # secret, so print the fingerprint and let the build continue onto
          # the step that will fail with a real error message.
          keytool -list -v -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" | grep 'SHA256:' || true

      # The llama-server binaries are not tracked in git — upstream ships
      # them as a release asset built in the Snapdragon toolchain. Fetch that
      # bundle so the APK can actually start a server instead of failing with
      # ENOENT on libllama-server.so.
      - name: Fetch llama-server native bundle
        id: bundle
        env:
          # Upstream ships a prebuilt bundle per release. The default matches
          # the llama.cpp version in assets/bin/llama_server_manifest.json;
          # set the LLAMA_SERVER_URL repository variable to override it without
          # editing this file.
          LLAMA_SERVER_URL: ${{ vars.LLAMA_SERVER_URL || 'https://github.com/ArkaneFans/servllama/releases/download/1.2.2/llama-server-v0.4.1-android-arm64-v8a.zip' }}
        run: |
          set -euo pipefail
          if [ -z "$LLAMA_SERVER_URL" ]; then
            echo "::error::repository variable LLAMA_SERVER_URL is not set"
            echo "It should point at the upstream llama-server-*-android-arm64-v8a.zip."
            exit 1
          fi
          mkdir -p /tmp/llama/out
          curl -sSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 900 \
            "$LLAMA_SERVER_URL" -o /tmp/llama/bundle

          # The published asset is named .zip but has changed shape between
          # releases: some are a tarball outright, some are a zip wrapping a
          # tarball. Sniff rather than trust the extension.
          if tar -tzf /tmp/llama/bundle >/dev/null 2>&1; then
            tar -xzf /tmp/llama/bundle -C /tmp/llama/out
          else
            unzip -q -o /tmp/llama/bundle -d /tmp/llama/out
          fi
          inner="$(find /tmp/llama/out -maxdepth 2 -name '*.tar.gz' | head -1 || true)"
          if [ -n "$inner" ]; then
            echo "Unwrapping inner tarball: $inner"
            tar -xzf "$inner" -C /tmp/llama/out
          fi

          echo "=== extracted files ==="
          find /tmp/llama/out -type f | sed "s|/tmp/llama/out/||" | sort | head -40

          jni="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$jni" assets/bin

          count=0
          while IFS= read -r so; do
            cp "$so" "$jni/"
            count=$((count + 1))
          done < <(find /tmp/llama/out -type f -name 'lib*.so')

          if [ "$count" -eq 0 ]; then
            echo "::error::the bundle contained no lib*.so files"
            exit 1
          fi
          # Only the files the app shells out to are mandatory; the rest are
          # accelerator backends and may legitimately be absent.
          test -f "$jni/libllama-server.so"
          test -f "assets/bin/llama_server_manifest.json"
          echo "Staged $count native libraries:"
          ls -la "$jni"

      - name: Build signed release APK
        # No --split-per-abi: the app pins ndk.abiFilters to arm64-v8a
        # because the llama-server binaries are arm64-only, and Gradle
        # rejects abi filters that overlap a split configuration.
        run: flutter build apk --release

      - name: Verify signature
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          [ -d "$BT" ] || BT="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"
          "$BT/apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | head -20

      # v1.3.3 shipped an APK that installed and then failed to start a
      # server, because the native libraries were absent. v1.3.6 added them
      # but nothing checked the packaging mode they ended up in.
      #
      # The app execs libllama-server.so as a child process, so it has to
      # exist as a real file in nativeLibraryDir. That requires
      # extractNativeLibs="true", which in turn means compressed .so entries
      # are correct and STORED ones would be the anomaly. Assert the
      # invariant rather than guessing at either one.
      - name: Assert native libraries are packaged
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"

          echo "=== extractNativeLibs ==="
          flag="$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" \
            | grep -oE 'extractNativeLibs[^ ]*' | head -1 || true)"
          echo "${flag:-<absent>}"
          if ! "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" \
            | grep -q 'extractNativeLibs.*0xffffffff'; then
            echo "::error::extractNativeLibs is not enabled; nativeLibraryDir will not be populated"
            exit 1
          fi

          echo "=== native entries in the APK ==="
          unzip -lv "$apk" \
            | awk '$NF ~ /^lib\/arm64-v8a\/lib.*[.]so$/ { print }' | head -30

          if ! unzip -l "$apk" | grep -q "lib/arm64-v8a/libllama-server.so"; then
            echo "::error::libllama-server.so is not in the APK"
            exit 1
          fi
          count="$(unzip -l "$apk" | grep -cE "lib/arm64-v8a/lib.*[.]so$" || true)"
          echo "arm64 native libraries in APK: $count"
          [ "$count" -ge 2 ] || { echo "::error::expected the llama/ggml libraries too"; exit 1; }

      - name: Package artefacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/servllama-${{ steps.ver.outputs.name }}-release.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A workflow_dispatch run has no tag to hang the release on yet.
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG="v${{ steps.ver.outputs.name }}"
            git tag -a "$TAG" -m "Release $TAG" && git push origin "$TAG"
          fi
          gh release create "$TAG" dist/* \
            --title "${TAG} — signed release" \
            --generate-notes --latest \
            || gh release upload "$TAG" dist/* --clobber
