name: verify

# The guard that did not exist until now.
#
# The release workflow builds and signs an APK without ever running the
# analyzer or the test suite — it has never done either. Everything the
# release checklist asks for ("analyze must be clean", "only the known
# failures") was therefore a promise made by a human to a document, on a
# machine nobody else could check. This workflow is what turns that promise
# into something that holds without anyone remembering it.
#
# It runs on every push and every pull request, needs no secrets, and fails
# only on something NEW: a dirty analyzer, a test file failing more than the
# baseline allows, or a new layering violation. Existing problems are
# baselined in tool/ so that the check is green today and red on regressions,
# which is the only form of a check that survives a real codebase.
#
# The release workflow runs the same tool before it builds anything.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pinned to the same Flutter the release builds with. A check that runs
      # on a different SDK reports different diagnostics than the thing it is
      # meant to gate, and a gate you cannot trust gets ignored.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Layering guards (no Flutter needed)
        run: |
          ./tool/check_architecture.sh --emit-report /tmp/arch.tsv
          python3 tool/lib/compare_failures.py \
            /tmp/arch.tsv tool/known_architecture_violations.txt

      - name: Analyze and test against the baseline
        run: ./tool/verify.sh

      # If this step is reached the baselines were accurate. If it is not
      # reached, the job is already red; nothing to do. Uploaded so a failure
      # can be diagnosed without re-running the suite.
      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: |
            /tmp/arch.tsv
          retention-days: 7