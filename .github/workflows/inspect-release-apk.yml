name: inspect-release-apk

# What actually shipped.
#
# `release.yml` asserts that libllama-server.so is packaged and that at least
# two lib*.so files are, with a comment saying the accelerator backends "may
# legitimately be absent". So whether libggml-opencl.so, libggml-hexagon.so or
# the Hexagon HTP kernels are in the published APK is currently nobody's
# responsibility — and HANDOFF.md records that the answer was never found,
# because the release asset could not be downloaded from the machines it was
# tried on.
#
# This runs where the download is fast. It fetches the published asset,
# checks it against the SHA256SUMS.txt published beside it, and only then
# opens it. A mismatch aborts rather than reporting on a corrupt file: a
# same-size wrong APK parses its central directory perfectly and produces a
# completely convincing listing, which is exactly the kind of thing that
# becomes a false claim three commits later.
#
# It answers "what is in the package". It does NOT answer "does it work" —
# that is hardware, and no amount of unzipping substitutes for a phone.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to inspect (e.g. v1.27.0)'
        required: true
        default: 'v1.27.0'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Interpolation goes through env rather than straight into the script
      # body: `${{ }}` spliced into `run:` is how a workflow_dispatch input
      # becomes command execution.
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the published asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --pattern 'SHA256SUMS.txt'
          ls -la

      # Before anything opens the archive. A corrupt download that happens to
      # be the advertised length is the failure this project has already hit
      # twice, and both times the size looked perfect.
      - name: Verify against the published SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          cd dl
          apk="$(ls *.apk)"
          expected="$(grep -F "$apk" SHA256SUMS.txt | awk '{print $1}')"
          [ -n "$expected" ] || { echo "::error::no checksum published for $apk"; exit 1; }
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          echo "expected: $expected"
          echo "actual:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checksum mismatch — refusing to inspect a file that is not the published artifact"
            exit 1
          fi
          echo "verified"

      - name: Unpack the arm64 native libraries
        run: |
          set -euo pipefail
          cd dl
          apk="$(ls *.apk)"
          # Deflate streams fail loudly on bad bytes; a partial file would
          # otherwise sail through and produce a short, plausible inventory.
          unzip -o -q "$apk" 'lib/arm64-v8a/*' -d unpacked
          find unpacked/lib/arm64-v8a -type f | sort

      # The central directory records a CRC per entry, so a good extraction can
      # be confirmed against the manifest rather than trusted.
      - name: Confirm every extracted file matches its recorded CRC-32
        run: |
          set -euo pipefail
          cd dl
          apk="$(ls *.apk)"
          unzip -lv "$apk" 'lib/arm64-v8a/*' | awk '$NF ~ /^lib\// { print $7, $NF }' \
            > /tmp/expected-crc.txt
          cat /tmp/expected-crc.txt
          fail=0
          while read -r crc name; do
            base="$(basename "$name")"
            got="$(cksum "unpacked/lib/arm64-v8a/$base" | awk '{printf "%08x", $1}')"
            if [ "$got" != "$crc" ]; then
              echo "::error::CRC mismatch for $base: got $got, manifest says $crc"
              fail=1
            fi
          done < /tmp/expected-crc.txt
          [ "$fail" -eq 0 ] || exit 1
          echo "all native libraries verified against the manifest"

      - name: Inventory
        run: |
          set -euo pipefail
          cd dl
          apk="$(ls *.apk)"
          {
            echo "## Native libraries in \`$apk\`"
            echo
            echo "| File | Bytes | Stands out |"
            echo "| --- | ---: | --- |"
            unzip -lv "$apk" 'lib/arm64-v8a/*' | awk '$NF ~ /^lib\// { printf "| `%s` | %s | |\n", $NF, $1 }'
            echo
            echo "### Accelerator libraries"
            echo
            found="$(unzip -l "$apk" | grep -cE 'lib/arm64-v8a/libggml-(opencl|hexagon|htp)' || true)"
            echo "- \`libggml-opencl.so\`: $(unzip -l "$apk" | grep -q 'libggml-opencl.so' && echo present || echo ABSENT)"
            echo "- \`libggml-hexagon.so\`: $(unzip -l "$apk" | grep -q 'libggml-hexagon.so' && echo present || echo ABSENT)"
            echo "- \`libggml-htp-*.so\`: $(unzip -l "$apk" | grep -oE 'libggml-htp-v[0-9]+\.so' | sort -u | tr '\n' ' ')"
            echo "- \`libOpenCL.so\`: $(unzip -l "$apk" | grep -q 'libOpenCL\.so' && echo present || echo 'absent (expected on Android — the ICD is a vendor system library)')"
            echo
            echo "NDK stubs are a few kilobytes. Anything in the hundreds of"
            echo "kilobytes or more is a real library, not a stub."
          } >> "$GITHUB_STEP_SUMMARY"

      # The libraries themselves, so the answer can be checked by hand rather
      # than taken on trust.
      - name: Upload the extracted libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ steps.tag.outputs.name }}
          path: dl/unpacked/lib/arm64-v8a/
          retention-days: 30
